# Linked to ~/.config/tmux/tmux.conf (tmux 3.1+ reads it from there).
# Everything not set here uses tmux's defaults: prefix C-b, splits with % and ",
# zoom with z, resize with C-Arrow / M-Arrow.

set -g mouse on

# Pass terminal focus events through to the program in the pane. Without this
# tmux swallows them, and nvim's 'autoread' never notices that a file changed on
# disk (git checkout, another pane) until something forces a reload.
set -g focus-events on

# Already vi because EDITOR is nvim, but explicit in case tmux starts without it
set -g mode-keys vi

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# vim-like copy mode: v selects, y copies (to the macOS clipboard via Ghostty)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
# Don't copy and exit copy mode when a mouse selection ends; copy with y instead
unbind -T copy-mode-vi MouseDragEnd1Pane

# Plugins (https://github.com/tmux-plugins/tpm): prefix + I installs, prefix + U updates
# Plugins are data, not config, so they go to $XDG_DATA_HOME instead of ~/.config/tmux
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'

# C-h/j/k/l moves between tmux panes and nvim splits (needs the nvim plugin too)
set -g @plugin 'christoomey/vim-tmux-navigator'
# The plugin takes C-l, so clear the screen with prefix + C-l
bind C-l send-keys C-l

# Save/restore sessions (prefix + C-s / C-r), saved to ~/.local/share/tmux/resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

# Save automatically every 15 minutes, and restore the last save when tmux starts
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Must be the last line
run '~/.local/share/tmux/plugins/tpm/tpm'
